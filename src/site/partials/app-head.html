    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Behind the sign-in: out of search results (the Worker also sends X-Robots-Tag). -->
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // A saved dark theme applies before first paint (src/ui/theme.ts; light is the default).
      try {
        if (localStorage.getItem('bouncereel:theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
