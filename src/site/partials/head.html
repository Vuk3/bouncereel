    <link rel="preload" href="/fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Before first paint: a saved dark theme (src/ui/theme.ts; light is the default), and
      // whether this browser has a session, from the hint cookie the Worker sets beside the
      // session (worker/auth/session.ts). A hint only: it swaps "Sign in" for "Open studio".
      try {
        if (localStorage.getItem('bouncereel:theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch {}
      if (/(?:^|;\s*)br_hint=1/.test(document.cookie)) document.documentElement.dataset.member = '';
    </script>
    <link rel="stylesheet" href="/src/site/site.css" />
