<!doctype html>
<html lang="en">
  <head>
    <!-- site:head /login -->
    <title>Sign in · BounceReel</title>
    <meta name="description" content="Sign in to BounceReel, the studio for ball race videos." />
  </head>
  <body>
    <!-- site:header -->

    <main id="main" class="auth">
      <section class="auth-box" aria-labelledby="auth-title">
        <h1 id="auth-title">Sign in</h1>

        <p class="form-error" id="error" role="alert" hidden></p>
        <p class="form-ok" id="ok" role="status" hidden></p>
        <!-- Google sign-in (GOOGLE_LOGIN in shared/site.ts): Google's own button, as its brand guidelines draw it. -->
        <div class="oauth" data-google="on">
          <a class="google-button" href="/api/auth/google" data-keep-next><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" /><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" /><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" /><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" /></svg><span>Continue with Google</span></a>
          <p class="oauth-or"><span>or with your email</span></p>
        </div>
        <form class="form" id="form" data-action="login" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary btn-wide" type="submit">Sign in</button>
          <p class="form-links"><a href="/forgot">Forgot your password?</a></p>
        </form>
        <p class="auth-alt" data-signups="open">New here? <a href="/signup" data-keep-next>Start free</a></p>
        <p class="auth-alt" data-signups="closed">New here? Sign-ups open soon.</p>
      </section>
    </main>

    <!-- site:footer -->
    <script type="module" src="/src/site/auth.ts"></script>
  </body>
</html>
