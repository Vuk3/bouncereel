<!doctype html>
<html lang="en">
  <head>
    <!-- site:head /forgot -->
    <title>Forgot your password? · BounceReel</title>
    <meta name="description" content="Get a link to set a new password for your BounceReel account." />
  </head>
  <body>
    <!-- site:header -->

    <main id="main" class="auth">
      <section class="auth-box" aria-labelledby="auth-title">
        <h1 id="auth-title">Forgot your password?</h1>
        <p>Enter your account’s email and we send a link to set a new password. It works for one hour.</p>
        <p class="form-error" id="error" role="alert" hidden></p>
        <p class="form-ok" id="ok" role="status" hidden></p>
        <form class="form" id="form" data-action="forgot" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required />
          </div>
          <button class="btn btn-primary btn-wide" type="submit">Send the link</button>
        </form>
        <p class="auth-alt"><a href="/login">Back to sign in</a></p>
      </section>
    </main>

    <!-- site:footer -->
    <script type="module" src="/src/site/auth.ts"></script>
  </body>
</html>
