<!doctype html>
<html lang="en">
  <head>
    <!-- app:head -->
    <link rel="stylesheet" href="/src/console.css" />
    <title>Videos · BounceReel</title>
  </head>
  <body class="console">
    <header class="console-top">
      <a href="/app" class="side-brand" aria-label="BounceReel: open the studio">
        <span class="logo" aria-hidden="true"></span>
        <span><strong>BounceReel</strong></span>
      </a>
      <nav class="top-nav" aria-label="Your pages">
        <a href="/app">Studio</a>
        <a href="/app/videos" aria-current="page">Videos</a>
        <a href="/account">Account</a>
        <a href="/admin" id="admin-link" hidden>Admin</a>
      </nav>
      <!-- app:theme -->
    </header>

    <main class="console-main">
      <header class="view-head">
        <div class="titles">
          <h1>Videos</h1>
          <p>Every recording, and where it went up. Tick a platform once the video is posted there.</p>
        </div>
        <div class="row-actions">
          <button id="paste-texts" type="button" class="button ghost" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9zM9 5.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.5a2 2 0 0 0-2-2h-2M9 12h6M9 16h4" /></svg>
            Paste texts
          </button>
          <a href="/app" class="button">
            <svg class="solid" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" /></svg>
            Record a video
          </a>
        </div>
      </header>

      <p id="verify" class="verify-banner" role="status" hidden></p>

      <section class="library-summary" aria-label="Totals">
        <div class="kpi">
          <span>Videos</span>
          <strong id="kpi-videos">0</strong>
          <small id="kpi-room"></small>
        </div>
        <div class="kpi" id="kpi-waiting-tile">
          <span>Not posted yet</span>
          <strong id="kpi-waiting">0</strong>
          <small id="kpi-waiting-note"></small>
        </div>
        <div class="card coverage">
          <h2>Posted on</h2>
          <div id="coverage" class="meters"></div>
        </div>
      </section>

      <div class="filters">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg>
          <span class="sr-only">Search</span>
          <input id="search" name="search" type="search" placeholder="Search names, sequences, seeds…" spellcheck="false" />
        </label>
        <select id="show" name="show" aria-label="Show">
          <option value="all">All videos</option>
          <option value="unposted">Not posted anywhere</option>
          <option value="no-youtube">Not on YouTube</option>
          <option value="no-tiktok">Not on TikTok</option>
          <option value="no-instagram">Not on Instagram</option>
        </select>
        <select id="sort" name="sort" aria-label="Sort">
          <option value="recorded:-1">Newest first</option>
          <option value="recorded:1">Oldest first</option>
          <option value="title:1">Title, A to Z</option>
          <option value="length:1">Shortest first</option>
          <option value="length:-1">Longest first</option>
          <option value="margin:1">Closest finish first</option>
        </select>
        <span id="count" class="library-count"></span>
      </div>

      <section class="card flush" aria-label="Your videos">
        <ul id="rows" class="video-list"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>
    </main>

    <!--
      One video, opened from its row (dashboard.ts openVideo): where it went up with each link, its
      facts, and for a superadmin the texts for posting it, the bouncereel-post skill's answer
      pasted and kept with it (docs/video-library.md §6). Paste texts opens it on a paste alone.
    -->
    <dialog id="video" class="drawer video-drawer" aria-labelledby="video-title">
      <header class="drawer-head">
        <div class="drawer-video">
          <span id="video-thumb" class="thumb" aria-hidden="true"><i></i><i></i></span>
          <div>
            <h2 id="video-title">Video</h2>
            <p id="video-what"></p>
          </div>
        </div>
        <button type="button" class="icon-button small" id="video-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <div id="video-body" class="drawer-body"></div>
      <footer id="video-foot" class="drawer-foot">
        <p id="video-error" class="drawer-error" role="alert"></p>
        <button type="button" id="video-delete" class="button ghost danger-text">Delete</button>
        <span class="spacer"></span>
        <a id="video-open" class="button" href="/app">Open in studio</a>
      </footer>
    </dialog>

    <p id="toast" class="toast" role="status" hidden></p>
    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
