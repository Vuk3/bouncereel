<!doctype html>
<html lang="en">
  <head>
    <!-- site:head /reset noindex -->
    <title>Set a new password · BounceReel</title>
    <meta name="description" content="Set a new password for your BounceReel account." />
  </head>
  <body>
    <!-- site:header -->

    <main id="main" class="auth">
      <section class="auth-box" aria-labelledby="auth-title">
        <h1 id="auth-title">Set a new password</h1>
        <p id="for" hidden></p>
        <p class="form-error" id="error" role="alert" hidden></p>
        <p class="form-ok" id="ok" role="status" hidden></p>
        <form class="form" id="form" data-action="reset" novalidate hidden>
          <input id="username" name="username" type="email" autocomplete="username" hidden />
          <div class="field">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint" />
            <small id="password-hint">At least 8 characters. Setting it signs you out everywhere else.</small>
          </div>
          <button class="btn btn-primary btn-wide" type="submit">Set the password</button>
        </form>
        <p class="auth-alt"><a href="/forgot">Ask for a new link</a></p>
      </section>
    </main>

    <!-- site:footer -->
    <script type="module" src="/src/site/auth.ts"></script>
  </body>
</html>
